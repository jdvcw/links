    <script>
            const snowContainer = document.getElementById('snow-container');
            function createSnowflake(){
                const flake = document.createElement('div');
                flake.classList.add('snowflake');

                const size = Math.random()*25+5;
                flake.style.width=`${size}px`;
                flake.style.height=`${size}px`;

                flake.style.left=`${Math.random()*100}%`;

                flake.style.opacity=Math.random()*0.6+0.3;

                const fallDuration = Math.random()*4+6;
                flake.style.animationDuration=`${fallDuration}s,${Math.random()*2+2}s`;

                snowContainer.appendChild(flake);

                setTimeout(() => {
                    flake.remove();
                }, fallDuration*1000);


            }

            setInterval(createSnowflake,250)


            const typingText = document.getElementById(`typing-text`)
            const phrases=[
                "Student ITMO SE",
                "[Warning] Target process terminated unexpectedly.",
                "bypass_vac.dll -> cs2.exe (PID: 4312)",
                "Status: Memory allocated at 0x7FFA4B20",
                "Please run Process Hacker as Administrator.",
                "Status: Connection lost.",
                `[Process Explorer] Error: Cannot open file "onetap.dll"`,
            ];


            let phraseIndex=0;
            let characterIndex=0;
            let isDeleting = false;

            function type(){
                const currentPhrase=phrases[phraseIndex]
                if (isDeleting){
                    typingText.textContent=currentPhrase.substring(0,characterIndex-1);
                    characterIndex--;
                }else{
                    typingText.textContent=currentPhrase.substring(0,characterIndex+1);
                    characterIndex++;
                }

                let typingSpeed=250;
                if (isDeleting){
                    typingSpeed/=2;
                }

                if (!isDeleting && characterIndex==currentPhrase.length){
                    typingSpeed=2000;
                    isDeleting=true;
                }
                else if (isDeleting && characterIndex==0){
                    isDeleting=false;
                    phraseIndex=(phraseIndex+1)%phrases.length;
                    typingSpeed=500;
                }
                setTimeout(type,typingSpeed);
            }
            setTimeout(()=>{
                type();
            },466)
    </script>
</body>
</html>
